[package]
name = "tg-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "tg_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
tg-crypto = { path = "../tg-crypto" }
tg-network = { path = "../tg-network" }
tg-storage = { path = "../tg-storage" }

tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
uniffi = { version = "0.28", features = ["tokio"] }
parking_lot = "0.12"
thiserror = "2.0"
tracing = "0.1"
tracing-android = "0.2"
bytes = "1.10"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
