[workspace]
resolver = "2"
members = [
    "crates/tg-crypto",
    "crates/tg-network",
    "crates/tg-storage",
    "crates/tg-ffi",
    "crates/tg-core",
    "crates/tg-media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Telegram Core Architecture Team <dev@telegram.org>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"             # Link-Time Optimization for smallest binary footprint
codegen-units = 1       # Maximum compiler optimizations
panic = "unwind"        # Required for std::panic::catch_unwind on FFI boundary!
strip = "symbols"       # Strips symbols to shrink .so size on mobile
debug = false
